name: Build and Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      matrix:
        go: ['1.21', '1.22']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sshcommands (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: janmz/sshcommands
          ref: v1.0.1
          path: sshcommands
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move sshcommands to parent for replace path
        run: |
          mv sshcommands ..
        if: runner.os != 'Windows'
      - name: Move sshcommands to parent for replace path (Windows)
        run: Move-Item -Path sshcommands -Destination ..
        if: runner.os == 'Windows'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go mod tidy
      - run: go build -v ./...
      - run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout sshcommands (replace dependency)
        uses: actions/checkout@v4
        with:
          repository: janmz/sshcommands
          ref: v1.0.1
          path: sshcommands
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Move sshcommands to parent for replace path
        run: mv sshcommands ..
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - run: golangci-lint run ./...
